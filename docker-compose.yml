services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_APP_NAME: SAMADHAN
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://samadhan:samadhan@postgres:5432/samadhan?schema=public
      JWT_ACCESS_SECRET: local-development-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samadhan
      POSTGRES_USER: samadhan
      POSTGRES_PASSWORD: samadhan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samadhan -d samadhan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
